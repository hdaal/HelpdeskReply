<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helpdesk Reply</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <main>
    <section class="tabs-section" aria-label="Abas de respostas">
      <div id="replyTabs" class="reply-tabs" role="tablist" aria-label="Temas das respostas"></div>
      <div class="tab-actions">
        <button id="showTabForm" class="text-button" type="button">+ Nova aba</button>
        <button id="renameTab" class="text-button" type="button">Renomear</button>
        <button id="deleteTab" class="text-button danger-text" type="button">Excluir</button>
      </div>
      <form id="tabForm" class="tab-form hidden">
        <label class="sr-only" for="tabName">Nome da nova aba</label>
        <input id="tabName" maxlength="30" placeholder="Ex.: Aprovações" required>
        <button class="button secondary" type="submit">Criar aba</button>
      </form>
    </section>

    <label class="sr-only" for="replySearch">Filtrar respostas</label>
    <input id="replySearch" class="search" type="search" placeholder="Filtrar respostas" autocomplete="off">
    <div id="quickReplies" class="reply-list" aria-live="polite"></div>
    <p id="emptyState" class="empty-state hidden">Nenhuma resposta encontrada.</p>

    <form id="addReplyForm" class="add-reply-form">
      <label for="newReply">Adicionar resposta</label>
      <textarea id="newReply" rows="3" maxlength="1000" placeholder="Digite uma nova resposta pronta" required></textarea>
      <button class="button primary" type="submit">Adicionar</button>
    </form>

    <form id="quickReplyForm" class="quick-reply-form">
      <div class="quick-reply-heading">
        <label for="quickReply">Resposta rápida</label>
        <span>Usada pelo atalho R da barra do Chrome.</span>
      </div>
      <textarea id="quickReply" rows="3" maxlength="1000" placeholder="Digite a mensagem que o atalho R deve inserir"></textarea>
      <button class="button primary" type="submit">Salvar resposta rápida</button>
    </form>

    <section class="backup-section" aria-labelledby="backupTitle">
      <div>
        <strong id="backupTitle">Cópia de segurança</strong>
        <span>Use para transferir ou recuperar respostas em outro perfil.</span>
      </div>
      <div class="backup-actions">
        <button id="exportBackup" class="button secondary" type="button">Exportar backup</button>
        <label class="button secondary file-button">
          Restaurar backup
          <input id="importBackup" type="file" accept="application/json,.json">
        </label>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <footer>Helpdesk Reply <span id="version"></span></footer>
  <script src="sidebar.js"></script>
</body>
</html>
